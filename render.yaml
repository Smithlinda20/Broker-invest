services:
  - type: web
    name: broker-invest
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python init_data.py
    startCommand: gunicorn broker_core.wsgi:application --bind 0.0.0.0:$PORT
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: broker_invest_db
          property: connectionString
databases:
  - name: broker_invest_db
    engine: postgresql
    plan: free
    region: oregon
